    <p>
      An <b>Ideathon</b> is an event where people come together to
      <u>brainstorm and pitch</u> new ideas to solve real-world problems.
      It is different from a hackathon because the focus is on the
      <span style="color:blue;">idea itself</span>, not building a finished product.
